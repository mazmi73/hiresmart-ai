server:
  port: 8080

spring:
  application:
    name: hiresmart-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://database:5432/hiresmart}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mail:
    host: ${SPRING_MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${SPRING_MAIL_PORT:2525}
    username: ${SPRING_MAIL_USERNAME:7879a042e0784a}
    password: ${SPRING_MAIL_PASSWORD:f3b17fd833fbc3}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

hiresmart:
  upload:
    dir: ${UPLOAD_DIR:/app/uploads/cvs}
  mail:
    from: ${MAIL_FROM:noreply@hiresmart.ai}
    from-name: ${MAIL_FROM_NAME:HireSmart AI}
    app-url: ${APP_URL:http://localhost:4200}
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    api-url: ${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite:generateContent}
  groq:
    api-key: ${GROQ_API_KEY:}
    api-url: ${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
  mistral:
    api-key: ${MISTRAL_API_KEY:}
    api-url: ${MISTRAL_API_URL:https://api.mistral.ai/v1/chat/completions}
  ollama:
    api-url: ${OLLAMA_API_URL:http://host.docker.internal:11434/v1/chat/completions}
    base-url: ${OLLAMA_BASE_URL:http://host.docker.internal:11434}
    model: ${OLLAMA_MODEL:llama3.2:3b}

springdoc:
  swagger-ui:
    path: /swagger-ui/index.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
